<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Profile Picture - Windows Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- Nostalgic WLM Avatar Frame Icon -->
            <svg class="logo" viewBox="0 0 24 24" fill="#0078d7" xmlns="http://www.w3.org/2000/svg" style="width: 60px; height: 60px;">
                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm6 12H6v-.5c0-2 4-3.1 6-3.1s6 1.1 6 3.1v.5z"/>
            </svg>
            <h1>Set Profile Picture</h1>
            <p>Enter details and select a custom avatar</p>
        </div>

        <div id="errorAlert" class="alert alert-danger" style="display:none;"></div>
        <div id="successAlert" class="alert alert-success" style="display:none;"></div>

        <form id="uploadForm">
            <div class="form-group">
                <label for="email">Sign-in address (Email)</label>
                <input type="email" id="email" required placeholder="example@live.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Verify account password">
            </div>

            <div class="avatar-preview-wrapper">
                <div id="avatarPreview" class="avatar-preview"></div>
                <div class="file-input-wrapper">
                    <button type="button" class="btn" style="margin-top:0; padding: 8px 16px; font-size:14px;">Select Image</button>
                    <input type="file" id="avatarFile" name="avatar" accept="image/*" required>
                </div>
            </div>

            <button type="submit" class="btn">Upload and Save Avatar</button>
        </form>

        <div class="footer-links">
            <a href="/register">Create a new account</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('avatarFile');
        const preview = document.getElementById('avatarPreview');

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.style.backgroundImage = `url(${e.target.result})`;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorAlert = document.getElementById('errorAlert');
            const successAlert = document.getElementById('successAlert');
            
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const file = fileInput.files[0];

            if (!file) {
                errorAlert.textContent = "Please select an image file first.";
                errorAlert.style.display = 'block';
                return;
            }

            const reader = new FileReader();
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                
                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            fileName: file.name,
                            avatarBase64: base64Data
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        successAlert.textContent = "Avatar updated successfully! Your friends will see the new picture shortly.";
                        successAlert.style.display = 'block';
                        document.getElementById('uploadForm').reset();
                        preview.style.backgroundImage = '';
                    } else {
                        errorAlert.textContent = data.error || "Failed to upload avatar.";
                        errorAlert.style.display = 'block';
                    }
                } catch (err) {
                    errorAlert.textContent = "Could not connect to the avatar upload server.";
                    errorAlert.style.display = 'block';
                    console.error(err);
                }
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
