[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "dotnet Server.dll"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Tell Railway which port serves HTTP traffic (for the web portal)
[[services]]
internalPort = 8080

# TCP service for the raw messenger protocol
# Railway will give you a public host:port in the dashboard under "TCP Proxy"
[[services]]
internalPort = 1863
tcpProxyEnabled = true
